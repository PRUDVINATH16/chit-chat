<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login chat-chat</title>
  <link rel="icon" href="/logos/logo.png?v=2" type="image/png">

  <!-- styles -->
  <link rel="stylesheet" href="styles/background.css">
  <link rel="stylesheet" href="styles/login-signup.css">
</head>

<body>

  <main class="stage">
    <!-- Grid -->
    <div class="grid-bg"></div>

    <!-- Soft light overlays -->
    <div class="soft-glow"></div>

    <!-- Neon glow blobs -->
    <div class="glow left"></div>
    <div class="glow right"></div>

    <div class="main-container">
      <div class="login-form-container">
        <div class="welcome-back-section">
          <svg class="chat-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-message-circle w-12 h-12 mx-auto text-slate-400 mb-4" aria-hidden="true">
            <path
              d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719">
            </path>
          </svg>
          <h2>Create Account</h2>
          <p>Sign up for a new account</p>
        </div>
        <form class="form-container form-container-signup">
          <div class="form-group">
            <label for="fullname" id="fullname">Enter full name</label>
            <div class="input-full-name">
              <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user auth-input-icon" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <input type="text" placeholder="Enter your Full Name" class="full-name">
            </div>
          </div>
          <div class="form-group">
            <label for="email" id="email">Email</label>
            <div class="input-email">
              <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-mail auth-input-icon" aria-hidden="true">
                <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              </svg>
              <input type="email" placeholder="johndoe@gmail.com" class="email">
            </div>
          </div>
          <div class="form-group">
            <label for="password" id="password">Password</label>
            <div class="input-password">
              <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-lock auth-input-icon" aria-hidden="true">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" placeholder="Enter your password" class="password">
            </div>
          </div>
          <button type="submit" class="signup-button">Create Account</button>
        </form>
        <div class="error-message">
          <p class="message"></p>
        </div>
        <div class="account-dont-have goto-login">
          <p class="goto-login">Already have an account? Login</p>
        </div>
      </div>
      <div class="login-illustration-container">
        <div class="image-container">
          <img src="img/signup-illustration.png" alt="login-illustration">
        </div>
        <div class="small-info">
          <div class="info-heading">
            <h3>Start Your Journey Today</h3>
          </div>
          <div class="small-chunks">
            <ul>
              <li>Free</li>
              <li>Easy Setup</li>
              <li>Private</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="scripts/signup.js" type="module"></script>

</body>

</html>
